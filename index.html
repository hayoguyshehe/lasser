    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">

      "@context": "https://schema.org",

      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"

      "featureList": [
        "SVG file parsing and validation",
        "DXF file parsing and validation",

        "Duplicate path detection",

        "Tiny geometry detection",

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is LaserPrep free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, LaserPrep is free. All file processing happens in your browser — there is no server upload, no subscription, and no tracking."
          }
        },
        {
          "@type": "Question",
          "name": "What file formats does LaserPrep support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LaserPrep supports SVG and DXF file formats. Both are parsed entirely in your browser using client-side JavaScript."
          }
        },
        {
          "@type": "Question",
          "name": "Are my files uploaded to a server?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. LaserPrep processes 100% of files in your browser. Your designs never touch a server, ensuring complete privacy."
          }
        },
        {
          "@type": "Question",
          "name": "What issues does LaserPrep detect?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LaserPrep detects open vectors, duplicate or overlapping paths, self-intersections, excessive node density, tiny geometry under 0.1mm, unconverted text elements, and embedded raster images in vector files."
          }
        }
      ]
    }
